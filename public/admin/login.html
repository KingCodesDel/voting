<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Forza Nova 2026</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h1>🏆 Admin Login</h1>
    <p class="sub">Sign in to manage the awards event</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="error-msg" id="loginError"></div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn" style="margin-top:8px;">
        <span id="loginBtnLabel">Log In</span>
      </button>
    </form>
  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
