# fly.toml app configuration file generated for voting26 on 2026-07-24T11:48:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'voting26'
primary_region = 'iad'

[build]

[env]
  DB_PATH = '/data/voting.db'
  NODE_ENV = 'production'
  PORT = '3000'
  UPLOAD_DIR = '/data/uploads'

[[mounts]]
  source = 'voting_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/settings'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
