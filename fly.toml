# fly.toml — Fly.io deployment config for the Awards Voting Platform
#
# Before first deploy:
#   1. fly launch --no-deploy   (generates an app name/region, skip if you
#                                already ran `fly launch` once)
#   2. fly volumes create voting_data --size 1
#   3. fly secrets set SESSION_SECRET=... CSRF_SECRET=... ADMIN_USERNAME=... ADMIN_PASSWORD=...
#   4. fly deploy
#
# `app` below will be overwritten with your actual app name by `fly launch`.

app = "awards-voting-platform"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Both the SQLite DB and uploaded nominee photos live on the mounted
  # volume below, so they survive deploys/restarts.
  DB_PATH = "/data/voting.db"
  UPLOAD_DIR = "/data/uploads"

[mounts]
  source = "voting_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/settings"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
